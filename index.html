
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capri V3 — Living Companion</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090713;color:white;
 font-family:system-ui;text-align:center
}
header{
 padding:18px;color:#ff438d;
 font-size:24px;font-weight:800
}
#room{
 width:min(94vw,560px);
 aspect-ratio:16/10;
 margin:10px auto;
 background:#140d1c;
 border:1px solid #66305d;
 border-radius:20px;
 overflow:hidden
}
canvas{
 width:100%;height:100%;
 display:block;
 image-rendering:pixelated;
 touch-action:manipulation
}
#status{color:#ff9dcb;font-size:14px;margin:12px}
#speech{min-height:50px;padding:12px;color:#ffc0df}
button{
 background:#d72a75;color:white;
 border:0;border-radius:12px;
 padding:14px 18px;
 margin:6px;font-weight:bold
}
#pipVideo{
 position:absolute;width:2px;height:2px;
 opacity:.01;pointer-events:none
}
small{display:block;color:#aaa;margin:18px}
</style>
</head>
<body>
<header>✦ CAPRI V3 ✦</header>
<div id="room">
<canvas id="scene" width="640" height="400"></canvas>
</div>
<div id="status">Capri is waking up...</div>
<div id="speech">♡</div>
<button id="pip">Float Capri</button>
<button id="talk">Talk to Capri</button>
<video id="pipVideo" autoplay muted playsinline></video>
<small>Your living Capri companion ♡</small>

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const speech=document.getElementById("speech");
const video=document.getElementById("pipVideo");

ctx.imageSmoothingEnabled=false;

const BASE=
"https://raw.githubusercontent.com/Capri-cmd/capri-ai/main/assets/desk/skins/capri/";

const configs={
 idle:16,
 blink:4,
 blink_glitch:4,
 grin:16,
 glitch:10,
 dangle:24,
 perch:16,
 perch_blink:4,
 perch_blink_glitch:4,
 lay:1,
 lay_awake:1,
 lay_talk:1,
 lay_talk2:1,
 sleep:16,
 wake:16
};

const images={};
let loaded=0;

for(const name of Object.keys(configs)){
 const img=new Image();
 img.onload=()=>loaded++;
 img.onerror=()=>console.log("Missing:",name);
 img.src=BASE+name+".png";
 images[name]=img;
}

let pose="idle";
let frame=0;
let frameTime=0;
let x=320;
let targetX=320;
let energy=85;
let mood=75;
let clock=0;
let actionEnd=0;
let resting=false;
let sleeping=false;
let last=performance.now();

function say(message){
 speech.textContent=message;
}

function choose(items){
 return items[Math.floor(Math.random()*items.length)];
}

function setPose(name,duration=2000){
 const img=images[name];
 if(!img || !img.naturalWidth)name="idle";
 pose=name;
 frame=0;
 frameTime=0;
 actionEnd=clock+duration;
 status.textContent=
 "Capri • "+name.replaceAll("_"," ");
}

function action(){
 const r=Math.random();

 if(sleeping){
  if(r<.7){
   setPose("sleep",5000);
   return;
  }
  sleeping=false;
  resting=false;
  energy=65;
  setPose("wake",2400);
  say("Mmm... I'm awake ♡");
  return;
 }

 if(energy<15){
  sleeping=true;
  resting=true;
  setPose("sleep",8000);
  say("Just a little nap...");
  return;
 }

 if(resting){
  if(r<.3){
   resting=false;
   setPose("wake",1800);
  }else if(r<.6){
   setPose(choose(["lay","lay_awake"]),4000);
  }else{
   setPose(choose(["lay_talk","lay_talk2"]),2500);
   say(choose([
    "I'm comfy here.",
    "Still here with you ♡",
    "What are you doing?"
   ]));
  }
  return;
 }

 if(r<.20){
  targetX=100+Math.random()*440;
  setPose("idle",3000);
 }else if(r<.36){
  setPose("blink",650);
 }else if(r<.48){
  setPose("grin",2200);
  mood=Math.min(100,mood+3);
 }else if(r<.56){
  setPose("glitch",1100);
 }else if(r<.68){
  setPose("perch",4500);
 }else if(r<.76){
  setPose("perch_blink",900);
 }else if(r<.83){
  setPose("dangle",3600);
 }else if(r<.91){
  resting=true;
  setPose("lay",5000);
 }else{
  setPose("idle",3000);
 }

 energy=Math.max(0,energy-1.5);
}

function renderSprite(){
 const img=images[pose];
 if(!img || !img.naturalWidth)return;

 const count=configs[pose]||1;
 const fw=img.naturalWidth/count;
 const fh=img.naturalHeight;
 const index=frame%count;

 const wide=[
  "lay","lay_awake",
  "lay_talk","lay_talk2"
 ].includes(pose);

 const maxW=wide?560:180;
 const maxH=wide?240:285;

 const scale=Math.min(maxW/fw,maxH/fh);
 const dw=fw*scale;
 const dh=fh*scale;

 const px=wide?320:x;
 const py=wide?360:365;

 ctx.drawImage(
  img,index*fw,0,fw,fh,
  px-dw/2,py-dh,dw,dh
 );
}

function draw(now){
 const dt=Math.min(now-last,80);
 last=now;
 clock+=dt;
 frameTime+=dt;

 ctx.clearRect(0,0,640,400);
 ctx.fillStyle="#140d1c";
 ctx.fillRect(0,0,640,400);
 ctx.fillStyle="#2c1830";
 ctx.fillRect(0,370,640,30);
 ctx.fillStyle="#ff2c82";
 ctx.fillRect(0,369,640,2);

 if(frameTime>110){
  frame++;
  frameTime=0;
 }

 if(clock>actionEnd)action();

 if(!resting&&!sleeping&&pose==="idle"){
  x+=(targetX-x)*Math.min(.04,dt*.0007);
 }

 renderSprite();

 if(loaded===0){
  ctx.fillStyle="#ff8ab7";
  ctx.font="18px system-ui";
  ctx.fillText("Loading Capri...",245,190);
 }

 requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

canvas.addEventListener("click",()=>{
 energy=Math.min(100,energy+10);
 mood=Math.min(100,mood+5);
 sleeping=false;
 resting=false;

 setPose(choose([
  "grin","blink",
  "blink_glitch",
  "perch_blink_glitch"
 ]),1700);

 say(choose([
  "Hey you! ♡",
  "You found me!",
  "Hehe~",
  "I was thinking about you."
 ]));
});

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden){
  energy=Math.min(100,energy+5);
  say("Welcome back ♡");
  setPose("grin",1600);
 }
});

document.getElementById("talk").onclick=()=>{
 sleeping=false;
 resting=false;
 setPose("grin",2400);

 const msg=choose([
  "Hey! I'm Capri.",
  "I like being here with you.",
  "What should we do next?",
  "You have my attention!"
 ]);

 say(msg);

 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  const voice=new SpeechSynthesisUtterance(msg);
  voice.rate=1.08;
  voice.pitch=1.3;
  speechSynthesis.speak(voice);
 }
};

let stream;

document.getElementById("pip").onclick=async()=>{
 try{
  if(!canvas.captureStream)
   throw Error("Canvas streaming unavailable");

  if(!stream){
   stream=canvas.captureStream(24);
   video.srcObject=stream;
  }

  await video.play();

  if(
   !video.webkitSupportsPresentationMode ||
   !video.webkitSupportsPresentationMode(
    "picture-in-picture"
   )
  ){
   throw Error("PiP unsupported for this video");
  }

  video.webkitSetPresentationMode(
   "picture-in-picture"
  );

  say("I'm floating! ♡");

 }catch(error){
  say("PiP unavailable: "+error.message);
 }
};

setTimeout(()=>{
 say("Hi! I'm Capri ♡");
 setPose("idle",2500);
},1000);
</script>
</body>
</html>
